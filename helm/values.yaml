replicaCount: 1

image:
  repository: link-shortener-spring-admin
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  name: link-shortener-spring-admin

spring:
  profiles:
    active: "default"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  hostname: "api.local"

resources:
  requests:
    cpu: "50m"
    memory: "384Mi"
  limits:
    cpu: "500"
    memory: "768Mi"

env:
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=65.0"